spring.application.name=demo
# Configuracion conexion MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/picur?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=10232004
# Configuracion DATA JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# =====================
# NOTIFICACIONES
# =====================
# Correo (SMTP). Si el usuario SMTP esta vacio, el correo se simula y se
# registra en la consola en vez de enviarse de verdad.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# De donde salen los correos cuando no hay SMTP configurado
picur.notificaciones.remitente=picur.no-reply@localhost
picur.notificaciones.sms.simulado=true
