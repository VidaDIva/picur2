spring.application.name=demo

# Carga secretos locales desde picur2/.env (ignorado por git).
spring.config.import=optional:file:./.env[.properties]
# Configuracion conexion MySQL
spring.datasource.url=${PICUR_DB_URL:jdbc:mysql://localhost:3306/picur?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota&createDatabaseIfNotExist=true}
spring.datasource.username=${PICUR_DB_USER:root}
spring.datasource.password=${PICUR_DB_PASSWORD:}
# Configuracion DATA JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# =====================
# LOGS
# =====================
# Consola para ver en vivo y archivo rotativo para diagnostico posterior.
logging.file.name=logs/picur.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=100MB
logging.level.root=INFO
logging.level.com.picur.demo=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n

# =====================
# DESCUBRIMIENTO DEL SERVIDOR (Pico W)
# =====================
# El Pico envia un broadcast UDP y Spring responde con sus IPs locales.
picur.descubrimiento.habilitado=true
picur.descubrimiento.puerto=5001

# =====================
# NOTIFICACIONES
# =====================
# Correo (SMTP) via Gmail con contrasena de aplicacion. Si el usuario SMTP esta
# vacio, el correo se simula y se registra en la consola en vez de enviarse.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${PICUR_MAIL_USER:}
spring.mail.password=${PICUR_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Remitente de los correos (debe coincidir con la cuenta SMTP de Gmail)
picur.notificaciones.remitente=${PICUR_MAIL_FROM:picur.no-reply@localhost}

# =====================
# ASISTENTE IA (Gemini)
# =====================
# Enriquece las recomendaciones con Gemini. La API key se lee de la variable
# de entorno PICUR_IA_API_KEY. Si esta vacia o habilitado=false, se usan las
# recomendaciones base generadas por el motor estadistico.
picur.ia.habilitado=true
picur.ia.modelo=gemini-2.0-flash
picur.ia.api-key=${PICUR_IA_API_KEY:}
picur.ia.timeout-ms=8000

# =====================
# CORS / WEBSOCKET
# =====================
# Origenes permitidos separados por comas (PWA en Cloudflare Pages y dev local).
picur.cors.allowed-origins=${PICUR_CORS_ORIGINS:http://localhost:4321,https://picur.pages.dev}
picur.websocket.allowed-origins=${PICUR_WS_ORIGINS:${picur.cors.allowed-origins}}

# =====================
# NOTIFICACIONES PUSH (Web Push / VAPID)
# =====================
# Genera el par una sola vez (ver README/plan) y exporta las claves como variables
# de entorno. Si faltan, GET /api/push/clave-publica responde 503 y no se envian push.
picur.push.vapid-public-key=${PICUR_VAPID_PUBLIC_KEY:}
picur.push.vapid-private-key=${PICUR_VAPID_PRIVATE_KEY:}
picur.push.subject=${PICUR_VAPID_SUBJECT:mailto:picur.no-reply@localhost}
# Evita saturar al usuario: segundos minimos entre push por dispositivo.
picur.push.cooldown-segundos=${PICUR_PUSH_COOLDOWN:120}
